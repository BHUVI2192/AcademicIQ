# Supabase project configuration
# https://supabase.com/docs/guides/cli/config

project_id = "academeiq-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false  # Admin/faculty are created by admin; parents use OTP

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Your AcademeIQ verification code is {{ .Code }}"

[auth.sms.twilio]
enabled = false
# Configure these via supabase secrets in production

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
